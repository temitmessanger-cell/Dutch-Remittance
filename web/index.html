<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Dutch Remit</title>
  <meta name="description" content="Send money to 32 countries — Africa, Europe and the US. Instant transfers, live rates, virtual cards." />
  <meta name="application-name" content="Dutch Remit" />
  <meta name="theme-color" content="#1546A0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D2E7A" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dutch Remit" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png" />

  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Dutch Remit — Send Money Worldwide" />
  <meta property="og:description" content="Send money to 32 countries. Live rates. Virtual cards." />
  <meta property="og:image"       content="icons/Icon-512.png" />
  <meta name="twitter:card"        content="summary" />
  <meta name="twitter:title"       content="Dutch Remit" />
  <meta name="twitter:description" content="Send money to 32 countries." />

  <style>
    html, body { margin:0; padding:0; background:#1546A0; height:100%; overflow:hidden; }

    #dr-splash {
      position:fixed; inset:0; background:#1546A0;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      z-index:9999; transition:opacity 0.35s ease;
    }
    #dr-splash.fade { opacity:0; pointer-events:none; }
    #dr-splash-icon {
      width:76px; height:76px; border-radius:20px;
      background:rgba(255,255,255,0.13);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    #dr-splash-icon img {
      width:100%; height:100%; object-fit:contain;
    }
    #dr-splash-name {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:20px; font-weight:700; color:#fff;
    }

    #a2hs {
      display:none; position:fixed; bottom:0; left:0; right:0;
      background:#fff; border-top:1px solid #e5e7eb;
      padding:12px 16px; z-index:8888;
      align-items:center; gap:12px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      box-shadow:0 -2px 16px rgba(0,0,0,.10);
    }
    #a2hs.show { display:flex; }
    #a2hs-icon {
      width:42px; height:42px; border-radius:10px; flex-shrink:0;
      background:#1546A0; display:block; object-fit:contain;
    }
    #a2hs-body { flex:1; min-width:0; }
    #a2hs-body strong { display:block; font-size:14px; color:#111; margin-bottom:2px; }
    #a2hs-body span   { font-size:12px; color:#666; }
    #a2hs-install {
      background:#1546A0; color:#fff; border:none; border-radius:8px;
      padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    }
    #a2hs-close { background:none; border:none; color:#bbb; font-size:18px; cursor:pointer; padding:0 4px; }
  </style>
</head>
<body>

  <div id="dr-splash">
    <div id="dr-splash-icon"><img src="icons/Icon-192.png" alt="Dutch Remit" /></div>
    <span id="dr-splash-name">Dutch Remit</span>
  </div>

  <div id="a2hs">
    <img id="a2hs-icon" src="icons/Icon-192.png" alt="Dutch Remit" />
    <div id="a2hs-body">
      <strong>Install Dutch Remit</strong>
      <span>Works offline · No browser bar · Faster</span>
    </div>
    <button id="a2hs-install">Install</button>
    <button id="a2hs-close">&#x2715;</button>
  </div>

  <script>
  (function(){
    'use strict';

    // ── PWA detection ──────────────────────────────────────────────────────
    function isPwa(){
      if(window.matchMedia('(display-mode: standalone)').matches) return true;
      if(window.navigator.standalone===true) return true;
      if(document.referrer.startsWith('android-app://')) return true;
      return false;
    }
    window.__DUTCH_REMIT_IS_PWA__ = isPwa();
    window.dutchRemitIsPwa = isPwa;

    // ── URL suppression in PWA mode ────────────────────────────────────────
    if(isPwa() && window.location.pathname !== '/'){
      try{ history.replaceState(null,'','/'); }catch(_){}
    }

    // ── SW registration ────────────────────────────────────────────────────
    var lastSwMsg = null;
    window.dutchRemitCanInstall = false;
    if('serviceWorker' in navigator){
      navigator.serviceWorker
        .register('/sw.js',{scope:'/',updateViaCache:'none'})
        .then(function(reg){
          console.log('[DR] SW registered');
          reg.update().catch(function(){});
        })
        .catch(function(e){ console.warn('[DR] SW failed',e); });

      navigator.serviceWorker.addEventListener('message',function(e){
        var d = e.data||{};
        lastSwMsg = d;
        window.__DR_SW_LAST_MSG__ = d;
        window.dispatchEvent(new CustomEvent('dr_sw_message',{detail:d}));
      });
    }
    window.getDrLastSwMessage = function(){ return lastSwMsg; };

    // ── Add-to-Home-Screen ────────────────────────────────────────────────
    var dip=null, a2hs=document.getElementById('a2hs');
    window.addEventListener('beforeinstallprompt',function(e){
      if(isPwa()) return;
      if(sessionStorage.getItem('a2hs_dismissed')) return;
      e.preventDefault(); dip=e;
      window.dutchRemitCanInstall = true;
    });
    document.getElementById('a2hs-install')
      &&document.getElementById('a2hs-install').addEventListener('click',function(){
        a2hs&&a2hs.classList.remove('show');
        if(dip){dip.prompt();dip.userChoice.then(function(){dip=null;});}
      });
    document.getElementById('a2hs-close')
      &&document.getElementById('a2hs-close').addEventListener('click',function(){
        a2hs&&a2hs.classList.remove('show');
        sessionStorage.setItem('a2hs_dismissed','1');
      });
    window.addEventListener('appinstalled',function(){
      a2hs&&a2hs.classList.remove('show'); dip=null;
    });
    window.dutchRemitTriggerInstall = function(){
      if(dip){a2hs&&a2hs.classList.remove('show');dip.prompt();}
    };

    // ── Remove pre-Flutter splash on first frame ───────────────────────────
    window.addEventListener('flutter-first-frame',function(){
      var s=document.getElementById('dr-splash');
      if(s){s.classList.add('fade');setTimeout(function(){s.remove();},380);}
    });
  }());
  </script>

  <!--
    flutter_bootstrap.js is auto-generated by flutter build web.
    For older Flutter versions that don't generate it, use:
      <script src="flutter.js" defer></script>

        window.addEventListener('load', () =>
          _flutter.loader.loadEntrypoint({

            onEntrypointLoaded: async (ei) => {
              const r = await ei.initializeEngine({ useColorEmoji: true });
              await r.runApp();
            }
          }));
      </script>
  -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
